<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI Assistant — Web Voice Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-root: #0A0F16;
            --bg-surface: #0D1117;
            --bg-card: #12181F;
            --bg-input: #161D27;
            --cyan: #00D4FF;
            --cyan-dim: #004D5E;
            --violet: #7B61FF;
            --violet-dim: #2D1B69;
            --green: #00FF87;
            --amber: #FFB02E;
            --red: #FF4D6D;
            --text-1: #E2E8F0;
            --text-2: #718096;
            --text-3: #4A5568;
            --border: #1E2D3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-root);
            color: var(--text-1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 64px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 24px;
            color: var(--cyan);
            animation: pulse 2s infinite;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-1);
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-2);
        }

        .status-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-3);
        }

        .status-pill.listening .status-dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .status-pill.thinking .status-dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
        .status-pill.speaking .status-dot { background: var(--violet); box-shadow: 0 0 10px var(--violet); }

        /* Main Body */
        main {
            flex: 1;
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            overflow: hidden;
        }

        /* Chat Panel */
        .chat-section {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-log {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .msg-user {
            align-self: flex-end;
            background: var(--violet-dim);
            color: var(--text-1);
            border-bottom-right-radius: 2px;
            border: 1px solid rgba(123, 97, 255, 0.3);
        }

        .msg-jarvis {
            align-self: flex-start;
            background: var(--cyan-dim);
            color: var(--text-1);
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .msg-system {
            align-self: center;
            background: var(--bg-card);
            color: var(--text-2);
            font-size: 12px;
            border-radius: 20px;
            padding: 6px 14px;
            border: 1px solid var(--border);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .card-header {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-3);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Waveform Animation */
        .waveform-box {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .wave-bar {
            width: 4px;
            height: 10px;
            background: var(--cyan);
            border-radius: 2px;
            transition: height 0.15s ease;
        }

        .waveform-box.active .wave-bar {
            animation: wave 0.8s infinite ease-in-out alternate;
        }

        .waveform-box.active .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .waveform-box.active .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .waveform-box.active .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .waveform-box.active .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .waveform-box.active .wave-bar:nth-child(6) { animation-delay: 0.5s; }

        @keyframes wave {
            0% { height: 8px; }
            100% { height: 45px; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Footer */
        .input-bar {
            padding: 16px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .api-key-input {
            width: 200px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .text-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .text-input:focus, .api-key-input:focus {
            border-color: var(--cyan);
        }

        .btn {
            background: var(--cyan-dim);
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--cyan);
            color: var(--bg-root);
        }

        .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-1);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mic-btn.active {
            background: #006040;
            color: var(--green);
            border-color: var(--green);
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">◈</div>
            <div>
                <div class="logo-title">JARVIS AI</div>
                <div class="logo-subtitle">Continuous Web Voice Assistant</div>
            </div>
        </div>
        <div class="status-pill" id="statusPill">
            <div class="status-dot"></div>
            <span id="statusText">Idle</span>
        </div>
    </header>

    <main>
        <div class="chat-section">
            <div class="chat-log" id="chatLog">
                <div class="msg-bubble msg-system">Jai Shree Ram! Welcome to Jarvis Web AI Voice Assistant.</div>
                <div class="msg-bubble msg-jarvis">Jai Shree Ram! Main Jarvis hoon. Mic button dabayein continuous voice mode start karne ke liye.</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <div class="card-header">Audio Monitor</div>
                <div class="waveform-box" id="waveform">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <div style="font-size: 12px; color: var(--text-3); text-align: center; margin-top: 8px;" id="waveState">
                    Waiting for mic activation…
                </div>
            </div>

            <div class="card">
                <div class="card-header">Groq API Key</div>
                <input type="password" id="apiKey" class="api-key-input" style="width:100%;" placeholder="Enter Groq API Key (gsk_...)" />
                <div style="font-size: 11px; color: var(--text-3); margin-top: 6px;">Key is stored locally in browser session.</div>
            </div>
        </div>
    </main>

    <div class="input-bar">
        <input type="text" id="userInput" class="text-input" placeholder="Type a message or click mic for continuous speech…" />
        <button class="btn" id="sendBtn">Send</button>
        <button class="mic-btn" id="micBtn" title="Toggle Continuous Listening">🎤</button>
    </div>

    <script>
        const chatLog = document.getElementById('chatLog');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const waveform = document.getElementById('waveform');
        const waveState = document.getElementById('waveState');

        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let conversationHistory = [
            { role: "system", content: "You are Jarvis, a helpful and fast AI assistant. Always start with 'Jai Shree Ram' if greeted. Respond in concise Hinglish (1-2 sentences max)." }
        ];

        // Load saved API key
        if (localStorage.getItem('groq_key')) {
            apiKeyInput.value = localStorage.getItem('groq_key');
        }

        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('groq_key', apiKeyInput.value.trim());
        });

        // Initialize Web Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-IN';

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                if (transcript && !isSpeaking) {
                    addMessage('user', transcript);
                    processCommand(transcript);
                }
            };

            recognition.onend = () => {
                if (isListening && !isSpeaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onerror = (event) => {
                console.warn('Speech recognition error:', event.error);
            };
        } else {
            addMessage('system', 'Web Speech API is not supported in this browser. Please use Chrome or Edge.');
        }

        function setStatus(state) {
            statusPill.className = 'status-pill ' + state;
            if (state === 'listening') {
                statusText.innerText = 'Listening…';
                waveState.innerText = 'Listening for speech…';
                waveform.classList.add('active');
            } else if (state === 'thinking') {
                statusText.innerText = 'Processing…';
                waveState.innerText = 'AI is thinking…';
                waveform.classList.remove('active');
            } else if (state === 'speaking') {
                statusText.innerText = 'Speaking…';
                waveState.innerText = 'Jarvis is speaking…';
                waveform.classList.add('active');
            } else {
                statusText.innerText = 'Idle';
                waveState.innerText = 'Waiting for activation…';
                waveform.classList.remove('active');
            }
        }

        function addMessage(role, text) {
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble msg-${role}`;
            bubble.innerText = text;
            chatLog.appendChild(bubble);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function toggleMic() {
            if (!recognition) return;
            if (!isListening) {
                isListening = true;
                micBtn.classList.add('active');
                setStatus('listening');
                addMessage('system', 'Continuous voice mode activated.');
                try { recognition.start(); } catch(e) {}
            } else {
                isListening = false;
                micBtn.classList.remove('active');
                setStatus('idle');
                addMessage('system', 'Voice mode stopped.');
                try { recognition.stop(); } catch(e) {}
            }
        }

        async function processCommand(text) {
            setStatus('thinking');
            const apiKey = apiKeyInput.value.trim() || localStorage.getItem('groq_key');
            if (!apiKey) {
                const msg = "Please enter your Groq API key in the sidebar.";
                addMessage('jarvis', msg);
                speak(msg);
                return;
            }

            conversationHistory.push({ role: "user", content: text });
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: conversationHistory,
                        max_tokens: 150
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content.replace(/<ACTION>.*?<\/ACTION>/g, '').trim();
                    conversationHistory.push({ role: "assistant", content: reply });
                    addMessage('jarvis', reply);
                    speak(reply);
                } else {
                    const err = "Could not connect to Groq API.";
                    addMessage('jarvis', err);
                    speak(err);
                }
            } catch (e) {
                addMessage('jarvis', "API Error: " + e.message);
                speak("API error occurred.");
            }
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) {
                setStatus(isListening ? 'listening' : 'idle');
                return;
            }

            window.speechSynthesis.cancel();
            isSpeaking = true;
            setStatus('speaking');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;

            // Pick a good English/Hindi voice if available
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Natural') || v.name.includes('David') || v.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onend = () => {
                isSpeaking = false;
                setStatus(isListening ? 'listening' : 'idle');
                if (isListening && recognition) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            utterance.onerror = () => {
                isSpeaking = false;
                setStatus(isListening ? 'listening' : 'idle');
            };

            window.speechSynthesis.speak(utterance);
        }

        micBtn.addEventListener('click', toggleMic);

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.strip ? userInput.value.trim() : userInput.value;
            if (text) {
                userInput.value = '';
                addMessage('user', text);
                processCommand(text);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
